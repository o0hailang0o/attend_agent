[tool.poetry]
name = "attend-agent"
version = "0.1.0"
description = "Attendance agent API with LlamaIndex function calling"
authors = ["dev"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
sqlalchemy = "^2.0.36"
aiomysql = "^0.2.0"
cryptography = "^44.0.0"
redis = "^5.2.0"
llama-index = "^0.12.0"
llama-index-core = "^0.12.0"
llama-index-llms-openai = "^0.3.0"
pyyaml = "^6.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
